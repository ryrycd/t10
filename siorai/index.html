<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0907;--gold:#d9b56a;--cream:#f3ebdd;--mute:#8d8273;--dot:#3a332b}
html,body{height:100%;background:#000;overflow:hidden;cursor:none}
body.showcursor{cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:"Cormorant Garamond","Didot","Bodoni 72",Georgia,serif}
.beat{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease-in-out;pointer-events:none}
.beat.on{opacity:1}
.beat.cut{transition:opacity .35s ease-out}
.beat *{animation-play-state:paused}.beat.on *{animation-play-state:running}
.shot{position:absolute;inset:-3%;background-size:cover;background-position:center;will-change:transform}
.push{animation:push 26s linear both}@keyframes push{from{transform:scale(1)}to{transform:scale(1.12)}}
.grade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,.45) 100%);pointer-events:none}

/* standby */
#b0{background:#000}
.hint{position:absolute;left:0;right:0;bottom:60px;text-align:center;font:400 22px/1.4 Jost,Helvetica,Arial,sans-serif;letter-spacing:.2em;color:#3d3832;text-transform:uppercase}
#b0.hidehint .hint{display:none}

/* video */
#b2{background:#000}
#b2 video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#b2 .fallback{display:none}
#b2.novid video{display:none}#b2.novid .fallback{display:block}

/* map */
#b3{background:radial-gradient(ellipse 70% 60% at 50% 45%,#16120d 0%,var(--bg) 70%)}
#map{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
#world{transform-origin:501px 308px;transition:transform 1.8s cubic-bezier(.45,0,.2,1)}
#b3.zoom #world{transform:translate(300px,140px) scale(1.3)}
.dots{stroke:var(--dot);stroke-width:5.2;stroke-linecap:round;opacity:0;animation:fin 1.2s ease-out .1s both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.arc{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:6 7;opacity:.55}
.origin circle{fill:var(--gold)}
.lbl{font-family:Jost,Helvetica,Arial,sans-serif;font-weight:500;font-size:25px;letter-spacing:.3em;fill:var(--cream)}
.lbl.small{font-size:19px;fill:var(--mute);letter-spacing:.28em}
.city{transition:opacity .9s ease}
.city.dim{opacity:.28}
.track{fill:none;stroke:#2c261f;stroke-width:7}
.ring{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-box:fill-box;transform-origin:center}
.goal{stroke:var(--cream);stroke-width:3}
.icon-frame{transition:opacity .4s}
.icon-store{opacity:0;transition:opacity .6s ease .3s}
.disc{fill:var(--gold);opacity:0;transition:opacity .6s ease .1s}
.won .disc{opacity:1}
.won .icon-frame{opacity:0}
.won .icon-store{opacity:1}
.won .ring{stroke:#f1d48f}
.flash{fill:none;stroke:var(--gold);stroke-width:3;opacity:0}
.won .flash{animation:flash 1.3s ease-out both}
@keyframes flash{0%{opacity:.9;r:40}100%{opacity:0;r:150}}
.tally{font-family:"Cormorant Garamond",Georgia,serif;font-size:40px;fill:var(--cream)}
.storename{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:46px;letter-spacing:.36em;fill:var(--gold);opacity:0;transition:opacity .8s ease .5s}
.won .storename{opacity:1}
#day{position:absolute;left:60px;top:50px;padding:34px 40px 30px;border-radius:6px;background:radial-gradient(ellipse at 40% 45%,rgba(11,9,7,.96) 55%,rgba(11,9,7,0) 100%);font-family:Jost,Helvetica,Arial,sans-serif;opacity:0;transition:opacity .6s}
#day.show{opacity:1}
#day .k{font-size:18px;letter-spacing:.4em;color:var(--mute)}
#day .v{font-family:"Cormorant Garamond",Georgia,serif;font-size:96px;line-height:1;color:var(--cream);margin-top:6px;font-variant-numeric:tabular-nums}
#day .v small{font-size:44px;color:var(--mute)}
#day .bar{width:300px;height:3px;background:#2c261f;margin-top:16px}
#day .bar i{display:block;height:100%;width:0;background:var(--gold)}

/* end card */
#b4{background:#070605;display:grid;place-items:center}
.endc{text-align:center}
.endc .name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:168px;letter-spacing:.42em;margin-right:-.42em;color:var(--cream);opacity:0;animation:rise 1.6s ease-out .2s both}
.endc .rule{width:0;height:2px;background:var(--gold);margin:34px auto;animation:rule 1.4s ease-out .9s both}
.endc .tag{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:62px;color:var(--gold);opacity:0;animation:rise 1.4s ease-out 1.5s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes rule{to{width:260px}}

/* black-out */
#black{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .5s;pointer-events:none;z-index:50}
#black.on{opacity:1}

/* presenter HUD (P) */
#hud{position:fixed;left:0;right:0;bottom:0;padding:14px 22px;background:rgba(10,8,6,.92);color:#f3ebdd;font:16px/1.4 -apple-system,Helvetica,Arial,sans-serif;display:none;z-index:99;gap:18px;align-items:flex-start}
#hud.show{display:flex}
#hud .k{color:#d9b56a;font-weight:700;white-space:nowrap}
#hud .rs{margin-left:auto;white-space:nowrap;color:#8d8273}
</style></head><body>

<script>
const CUES=[
 "Standby: black. Press → (or tap NEXT on the phone) when the skit starts.",
 "GALLERY. Holds from the opening silence through Jilles: “Come with me, and we’ll find one that fits you.”",
 "OMAR VIDEO. On Omar: “Our strategy: Before we pay a fortune for a store abroad…” Plays once (10s) and holds on its last frame.",
 "MAP. On Jeda: “The live artist proves every piece is real handwork…” Bangalore → London / New York / Dubai, 14 days of sales, New York becomes a store. Holds through Omar’s Alayna line.",
 "END CARD. Omar turns the hoop to the audience. Jeda: “SIORAI. Art you can wear.”"
];
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
new Image().src='media/gallery.jpg';

/* ---------- map ---------- */
const NS='http://www.w3.org/2000/svg';
const ORIGIN=[1310,525];
const CITIES=[
 {id:'ny',name:'NEW YORK',x:501,y:308,goal:1.0,  pieces:41,lx:0,ly:92, anchor:'middle'},
 {id:'ldn',name:'LONDON', x:895,y:223,goal:.66,  pieces:27,lx:62, ly:-8,anchor:'start'},
 {id:'dxb',name:'DUBAI',  x:1191,y:429,goal:.40, pieces:16,lx:62, ly:-8,anchor:'start'}
];
const R=40,CIRC=2*Math.PI*R;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const arcsG=document.getElementById('arcs'),citiesG=document.getElementById('cities');
CITIES.forEach(c=>{
  const mx=(ORIGIN[0]+c.x)/2,my=Math.min(ORIGIN[1],c.y)-170-Math.abs(ORIGIN[0]-c.x)*.12;
  c.arc=el('path',{class:'arc',d:`M${ORIGIN[0]} ${ORIGIN[1]} Q${mx} ${my} ${c.x} ${c.y}`},arcsG);
  const g=el('g',{class:'city',transform:`translate(${c.x} ${c.y})`,opacity:0},citiesG);c.g=g;
  el('circle',{class:'flash',r:40},g);
  el('circle',{class:'track',r:R},g);
  c.ring=el('circle',{class:'ring',r:R,'stroke-dasharray':`0 ${CIRC}`},g);
  el('line',{class:'goal',x1:0,y1:-R-9,x2:0,y2:-R+9},g);
  el('circle',{r:R-5,fill:'#0b0907'},g);
  el('circle',{class:'disc',r:R-5},g);
  const fr=el('g',{class:'icon-frame'},g);
  el('rect',{x:-13,y:-16,width:26,height:32,fill:'none',stroke:'#d9b56a','stroke-width':2.4},fr);
  el('rect',{x:-7,y:-10,width:14,height:20,fill:'none',stroke:'#d9b56a','stroke-width':1.6},fr);
  const st=el('g',{class:'icon-store'},g);
  el('path',{d:'M-20 -15 h40 v8 q-5 6 -10 0 q-5 6 -10 0 q-5 6 -10 0 q-5 6 -10 0 z',fill:'#0b0907'},st);
  el('rect',{x:-17,y:-6,width:34,height:24,fill:'none',stroke:'#0b0907','stroke-width':3,'stroke-linejoin':'round'},st);
  el('rect',{x:-5,y:4,width:10,height:14,fill:'#0b0907'},st);
  const lx=c.lx,ly=c.ly;
  el('text',{class:'lbl',x:lx,y:ly,'text-anchor':c.anchor},g).textContent=c.name;
  c.tally=el('text',{class:'tally',x:lx,y:ly+44,'text-anchor':c.anchor},g);
  // little hanger glyph + count reads as "pieces taken home"
  c.tally.textContent='0';
  if(c.id==='ny'){const sn=el('text',{class:'storename',x:0,y:-R-28,'text-anchor':'middle'},g);sn.textContent='SIORAI';}
});
// precompute stepwise sales so rings tick like real purchases
function salesSteps(c,seed){let s=seed,steps=[],t=0;const n=c.pieces;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;t+=0.4+s/233280;steps.push(t)}const tot=steps[n-1];return steps.map(x=>x/tot)}
CITIES.forEach((c,i)=>{c.steps=salesSteps(c,17+i*31)});
let mapRAF=0;
const T={dots:0,origin:500,arcs:1100,pins:2300,days:2900,daysEnd:10600,win:10800,zoom:11400};
function mapReset(){
  cancelAnimationFrame(mapRAF);
  const b3=document.getElementById('b3');b3.classList.remove('zoom');
  document.getElementById('origin').setAttribute('opacity',0);
  document.getElementById('day').classList.remove('show');
  CITIES.forEach(c=>{const L=c.arc.getTotalLength();c.L=L;c.arc.style.strokeDasharray=`${L} ${L}`;c.arc.style.strokeDashoffset=L;c.g.setAttribute('opacity',0);c.g.classList.remove('won','dim');c.ring.setAttribute('stroke-dasharray',`0 ${CIRC}`);c.tally.textContent='0';});
}
function mapPlay(){
  mapReset();const t0=performance.now();
  const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  const tick=now=>{const t=now-t0;
    document.getElementById('origin').setAttribute('opacity',Math.min(1,Math.max(0,(t-T.origin)/500)));
    CITIES.forEach((c,i)=>{
      const a=Math.min(1,Math.max(0,(t-T.arcs-i*180)/1100));c.arc.style.strokeDashoffset=c.L*(1-ease(a));
      if(a>=1&&!c.dashed){c.arc.style.strokeDasharray='6 7';c.arc.style.strokeDashoffset=0;c.dashed=1}
      if(a<1){c.dashed=0}
      c.g.setAttribute('opacity',Math.min(1,Math.max(0,(t-T.pins-i*180)/500)));
      const d=Math.min(1,Math.max(0,(t-T.days)/(T.daysEnd-T.days)));
      // how far along this city's own sales curve we are; NY finishes exactly on day 14
      const reach=c.goal; let sold=0;for(const s of c.steps){if(s*1<=d)sold++;}
      const frac=(sold/c.pieces)*reach;
      c.ring.setAttribute('stroke-dasharray',`${CIRC*frac} ${CIRC}`);
      c.tally.textContent=sold;
    });
    const d=Math.min(1,Math.max(0,(t-T.days)/(T.daysEnd-T.days)));
    if(t>T.days)document.getElementById('day').classList.add('show');
    document.getElementById('dayn').textContent=Math.min(14,1+Math.floor(d*14));
    document.getElementById('dayb').style.width=(d*100)+'%';
    if(t>T.win){const ny=CITIES[0];if(!ny.g.classList.contains('won')){ny.g.classList.add('won');CITIES.slice(1).forEach(c=>c.g.classList.add('dim'));}}
    if(t>T.zoom)document.getElementById('b3').classList.add('zoom');
    if(t<T.zoom+2000)mapRAF=requestAnimationFrame(tick);
  };
  mapRAF=requestAnimationFrame(tick);
}
mapReset();

/* ---------- video ---------- */
const vid=document.getElementById('vid'),b2=document.getElementById('b2');
vid.addEventListener('error',()=>b2.classList.add('novid'));
vid.addEventListener('loadeddata',()=>b2.classList.remove('novid'));

/* ---------- beats ---------- */
const beats=[...document.querySelectorAll('.beat')];let cur=0;const N=beats.length-1;
function restartAnims(b){b.querySelectorAll('*').forEach(e=>e.style.animationName='none');void b.offsetWidth;b.querySelectorAll('*').forEach(e=>e.style.animationName='')}
function go(n){n=Math.max(0,Math.min(N,n));
  beats.forEach((b,i)=>{if(i===n){restartAnims(b);b.classList.add('on')}else b.classList.remove('on')});
  document.getElementById('b0').classList.toggle('hidehint',n!==0||cur!==0);
  if(n===2){try{vid.currentTime=0;const p=vid.play();if(p)p.catch(()=>b2.classList.add('novid'))}catch(e){b2.classList.add('novid')}}else{try{vid.pause()}catch(e){}}
  if(n===3)mapPlay();else cancelAnimationFrame(mapRAF);
  cur=n;document.getElementById('black').classList.remove('on');
  document.getElementById('hb').textContent=n;document.getElementById('hc').textContent=CUES[n];}
function black(){document.getElementById('black').classList.toggle('on')}
addEventListener('keydown',e=>{const k=e.key;
  if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].includes(k)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(k)){e.preventDefault();go(cur-1)}
  else if(k==='r'||k==='R'||k==='Home'){go(0)}
  else if(k==='b'||k==='B'||k==='.'){black()}
  else if(k==='p'||k==='P'){document.getElementById('hud').classList.toggle('show');document.body.classList.toggle('showcursor')}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(/^[0-4]$/.test(k)){go(+k)}});
addEventListener('click',()=>go(cur+1));

/* ---------- phone remote (ryrycd.github.io/t10/siorai/remote) ---------- */
const q=new URLSearchParams(location.search);
const CODE=(q.get('remote')||'siorai').toLowerCase().replace(/[^a-z0-9-]/g,'');
const RURL='https://t10-remote.ryrycdryrycd.workers.dev/r/'+CODE;let last=-1;
const rs=document.getElementById('rs');
async function poll(){try{const r=await fetch(RURL,{cache:'no-store'});const v=await r.json();rs.textContent='remote: '+CODE+' ✓';
  if(last<0)last=v.seq;else if(v.seq!==last){last=v.seq;
    if(v.cmd==='black')black();
    else if(v.cmd==='replay')go(+v.i|0);
    else{const i=+v.i|0;if(i!==cur)go(i)}}}
  catch(e){rs.textContent='remote: '+CODE+' (offline)'}
  setTimeout(poll,300)}
setTimeout(poll,500);

if(q.has('beat'))go(+q.get('beat'));if(q.has('hud'))document.getElementById('hud').classList.add('show');
document.getElementById('hc').textContent=CUES[cur];
</script></body></html>

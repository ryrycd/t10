<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0907">
<title>SIORAI Remote</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0907;color:#f3ebdd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.app{display:flex;flex-direction:column;height:100%;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#a89c8b}
.pos{font-weight:800;color:#d9b56a;letter-spacing:.08em;text-transform:uppercase}
.st{font-weight:700}.st.ok{color:#5fd38b}.st.bad{color:#ff6b5b}
.screen{margin-top:10px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#0b0907;background:#d9b56a;border-radius:8px;padding:6px 10px;align-self:flex-start}
.say{flex:1;overflow:auto;margin:10px 0;padding:14px;border-radius:16px;background:#17130f;border:1px solid #3a3129;font-size:21px;line-height:1.38}
.say .who{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#d9b56a;margin-bottom:6px}
.say .tap{display:block;margin-top:12px;padding-top:10px;border-top:1px dashed #4a4036;color:#ffd38a;font-size:16px}
.nextp{font-size:13px;color:#a89c8b;margin:0 2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chips button{flex:1;padding:10px 2px;border-radius:10px;border:1px solid #3a3129;background:#17130f;color:#f3ebdd;font-weight:700;font-size:12px}
.chips button.on{border-color:#d9b56a;color:#d9b56a}
.row{display:flex;gap:10px}
.back{flex:0 0 26%;border-radius:18px;border:1px solid #3a3129;background:#17130f;color:#f3ebdd;font-size:28px;font-weight:800}
.next{flex:1;height:24vh;min-height:130px;border:0;border-radius:18px;background:linear-gradient(135deg,#e9c77d,#b8893a);color:#1a1307;font-size:36px;font-weight:900;letter-spacing:.02em}
.next:active,.back:active{transform:scale(.98);filter:brightness(1.1)}
.mini{display:flex;gap:8px;margin-top:8px}
.mini button{flex:1;padding:10px;border-radius:12px;border:1px solid #3a3129;background:#17130f;color:#a89c8b;font-weight:700;font-size:13px}
</style></head><body><div class="app">
<div class="top"><span class="pos" id="pos"></span><span class="st" id="st">Ready</span></div>
<span class="screen" id="screen"></span>
<div class="say" id="say"></div>
<div class="nextp" id="nextp"></div>
<div class="chips"><button data-j="0">Start</button><button data-j="1">Gallery</button><button data-j="2">Omar video</button><button data-j="3">Map</button><button data-j="5">End</button></div>
<div class="row"><button class="back" id="back">‹</button><button class="next" id="next">NEXT ›</button></div>
<div class="mini"><button id="replay">↻ Replay this screen</button><button id="blk">■ Black out</button></div>
</div>
<script>
const CODE=(new URLSearchParams(location.search).get('code')||'siorai').toLowerCase().replace(/[^a-z0-9-]/g,'');
const RURL='https://t10-remote.ryrycdryrycd.workers.dev/r/'+CODE;
// b = which screen the deck shows for this step
const S=[
 {b:0,l:'Standby',scr:'Black',who:'Before the skit',say:'Screen is black. Omar on the stool, Kayee and Jilles in the frames, AJ on guard.',tap:'Tap NEXT the moment the skit starts (the 4 seconds of silence).'},
 {b:1,l:'Gallery',scr:'Gallery photo',who:'Jilles · Michael',say:'Jilles: “Made by hand in Bangalore, India. Our artist, Omaar spent two hundred hours on it.”<br><br>Michael: “It’s beautiful. What’s something like this worth?”<br>Jilles: “Twelve hundred dollars. And we have it in your size.”<br>Michael: “Wait… you can actually buy it?”<br>Jilles: “You can buy everything in this room. Come with me, and we’ll find one that fits you.”',tap:'Gallery holds through all of this. Tap NEXT when Omar starts talking.'},
 {b:2,l:'Omar video',scr:'Omar in the gallery (10s video)',who:'Omar',say:'“Our strategy: Before we pay a fortune for a store abroad, we’ll test whether people there will buy. For two weeks, one of our Indian Artists will work LIVE inside of an art gallery.”',tap:'Video plays once and holds. Tap NEXT when Jeda starts.'},
 {b:3,l:'Map',scr:'Map: Bangalore → 3 galleries → New York store',who:'Jeda',say:'“The live artist proves every piece is real handwork. Their whole collection hangs on the walls, ready for visitors to try on. After two weeks, if there are enough sales from the art gallery, that city gets a store.”',tap:'Map plays by itself (~9s). Tap NEXT for Omar’s line (screen stays on the map).'},
 {b:3,l:'Alayna line',scr:'Map (holds)',who:'Omar',say:'“We partner with a gallery, the way Alayna sold art before Siorai.”',tap:'Screen doesn’t change. Tap NEXT when Omar turns the hoop to the audience.'},
 {b:4,l:'End card',scr:'SIORAI · Art you can wear.',who:'Omar → Jeda',say:'Omar ties off the thread, stands, turns the hoop: it reads SIORAI.<br><br>Jeda: “SIORAI. Art you can wear.”',tap:'Last screen. It holds.'}
];
let k=0;try{const s=parseInt(localStorage.getItem('sioraiR'),10);if(s>=0&&s<S.length)k=s}catch(e){}
const $=id=>document.getElementById(id);
function render(){const s=S[k];
  $('pos').textContent=(k+1)+'/'+S.length+' · '+s.l;$('screen').textContent='Screen: '+s.scr;
  $('say').innerHTML='<span class="who">'+s.who+'</span>'+s.say+(s.tap?'<span class="tap">'+s.tap+'</span>':'');$('say').scrollTop=0;
  $('nextp').textContent=k<S.length-1?'Next: '+S[k+1].l:'Last screen';
  document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',+b.dataset.j===k||(k===4&&+b.dataset.j===3)));
  try{localStorage.setItem('sioraiR',k)}catch(e){}}
async function send(body){const st=$('st');st.textContent='Sending…';st.className='st';
  try{const r=await fetch(RURL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0;st.textContent='✓ Sent';st.className='st ok'}
  catch(e){st.textContent='⚠ Not sent: tap again';st.className='st bad'}}
function go(n){k=Math.max(0,Math.min(S.length-1,n));render();if(navigator.vibrate)navigator.vibrate(12);send({i:S[k].b})}
$('next').onclick=()=>go(k+1);$('back').onclick=()=>go(k-1);
$('replay').onclick=()=>{if(navigator.vibrate)navigator.vibrate(12);send({i:S[k].b,cmd:'replay'})};
$('blk').onclick=()=>{if(navigator.vibrate)navigator.vibrate([10,30,10]);send({i:S[k].b,cmd:'black'})};
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>go(+b.dataset.j));
async function wake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});wake();
render();
</script></body></html>
